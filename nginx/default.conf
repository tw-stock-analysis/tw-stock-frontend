map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve at request time so replacing the backend container needs no reload.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    location = /api {
        include /etc/nginx/api-proxy.conf;
    }

    location ^~ /api/ {
        include /etc/nginx/api-proxy.conf;
    }

    # Vite assets have content hashes; missing assets must remain real 404s.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React Router handles page routes, including direct visits and refreshes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
